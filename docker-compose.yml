services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  web-dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
